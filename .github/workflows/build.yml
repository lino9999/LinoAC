name: Build LinoAC
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: LinoAC
          path: target/LinoAC-*.jar
