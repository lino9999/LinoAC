config-version: 2
settings:
  minimum-tps: 1.0
  maximum-ping: 100000
  join-grace-ticks: 100
  join-check-wait-time: 2500
  min-ticks-existed: 3
  violation-reset-enabled: true
  violation-reset-seconds: 480
  alert-cooldown-ms: 1000
  log-retention-days: 14
  recent-log-limit: 200
  console-alerts: true
  alerts-on-join: true
  automatic-punishments: false
  excluded-worlds: []
  ignore-bedrock: true
  cinematic: false
  entity-collision: true
  velocity-world-border: false
  flight-cooldown: 40
  cancel-hits: false
  cancel-hits-ms: 3000
  cancel-hits-cancel-event: false
  cancel-hits-checks: []
  punishment-delay-ticks: 0
  automatic-punishment-cooldown-ms: 10000
  statistics-interval-seconds: 900
  statistics-broadcast: false
  server-name: 'Minecraft Server'
limits:
  reach-margin: 0.45
  maximum-cps: 25
  maximum-placements: 15
  maximum-packets: 500
  bridge-placements: 6
  minimum-break-difference: -125
  elytra-speed: 4.25
  improbable-combat: 25
  improbable-movement: 30
  improbable-player: 30
  improbable-autoclicker: 30
  improbable-total: 50
  improbable-scaffold: 25
integrations:
  mcmmo: true
  entity-cram:
    enabled: false
    maximum-entities: 10
    grace-ticks: 30
connection:
  enabled: true
  maximum-pending: 128
  timeout-seconds: 30
  maximum-ping: 20000
  flood-kick: true
  kick-message: 'Connection verification timed out. Please reconnect.'
ghost-blocks:
  enabled: false
  minimum-ticks: 20
  setback: false
logs:
  maximum-file-mib: 32
  violations:
    enabled: true
    format: '%player% failed %check% VL=%vl% ping=%ping% %info%'
  punishments:
    enabled: true
    format: 'reason=%check% command=%command% dispatched=%dispatched%'
brands:
  resolve: true
  alerts: true
  console: false
  message: '&f%player% &7joined using &f%brand%&7.'
  ignored: [vanilla]
  blocked: []
  whitelist-enabled: false
  whitelist: []
punishments:
  manual-commands:
    - 'ban %player% Unfair advantage'
freeze:
  logout-commands: []
wave:
  automatic: false
  interval-seconds: 3600
  queue-automatic-punishments: false
  skip-queued-automatic-punishments: false
  entry-delay-ticks: 20
  started-broadcast: []
  ended-broadcast: []
  entry-broadcast: []
  commands:
    - 'ban %player% Unfair advantage'
proxy:
  enabled: true
  channel: 'linoac:proxy'
  alert-separator: '#LINOAC#'
webhook:
  enabled: false
  url: ''
  alert-url: ''
  punishment-url: ''
  alerts: true
  punishments: true
  embed: true
  include-context: true
  username: LinoAC
  avatar-url: ''
  footer: 'LinoAC by Lino'
  alert-title: 'LinoAC Alert'
  alert-color: '#35B879'
  punishment-title: 'LinoAC Punishment'
  punishment-color: '#DB4B4B'
alerts:
  experimental-symbol: '*'
  maximum-violations: 0
  console-format: '%player% failed %check% VL=%vl% ping=%ping% %info%'
  format: '&f%player% &7failed &a%check% &8[&fVL %vl%&8]'
  hover:
    - 'Ping: %ping%ms | TPS: %tps% | Client: %version%'
    - '%description%'
    - '%info%'
    - 'Click to teleport.'
  click-command: '/linoac teleport %player%'
  custom-commands: []
  severity:
    enabled: true
messages:
  prefix: '&2&lLinoAC &8»'
  alert: '&f%player% &7failed &a%check% &8[&fVL %vl%&8]'
  no-permission: '&cYou do not have permission to use this command.'
  unknown-command: '&cUnknown command. Use /linoac help.'
  blocked-brand: '&cThis client brand is not allowed on this server.'
  violation-reset: ''
  punishment-broadcast: '&c%player% was punished for %check%.'
  statistics-broadcast: '&7LinoAC recorded %amount% punishments in the past seven days.'
checks:
  defaults:
    enabled: true
    buffer: 1
    buffer-multiplier: 0.5
    decay: 0.1
    max-violations: 20
    setback: false
    minimum-setback-violations: 1
    punishable: false
    alert-interval: 1
    minimum-alert-violations: 1
    maximum-ping: 100000
    minimum-tps: 19
    webhook-interval: 1
    broadcast-punishment: false
    shuffle-minimum: 0
    shuffle-interval: 1
    rotate-minimum: 0
    rotate-interval: 1
